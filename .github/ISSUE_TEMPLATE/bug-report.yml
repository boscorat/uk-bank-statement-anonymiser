name: "Bug report"
description: "Report a general bug (not related to statement anonymisation)."
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please describe the issue in your own words.

        > **Do not paste log output, debug output, or console transcripts without checking for PII.**
        > These may contain account numbers, names, addresses, or other sensitive data.
        > Redact any sensitive content before sharing.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: Describe the bug.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: uk-bank-statement-anonymiser version
      description: >
        Run `anonymise-pdf --version` or check your `pyproject.toml` / `requirements.txt`.
      placeholder: e.g. 0.1.7
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: >
        Steps to reproduce the behaviour.
      placeholder: |
        1. Install uk-bank-statement-anonymiser
        2. Run command X
        3. See error
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: >
        What actually happened? Do not paste raw output without checking for PII.
      placeholder: Describe what happened (without pasting sensitive output).
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: >
        Anything else that might help — OS, Python version, etc.
    validations:
      required: false
