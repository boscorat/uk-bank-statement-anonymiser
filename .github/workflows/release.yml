# release.yml — create draft GitHub Release and open a CHANGELOG PR on tag push.
#
# Triggered by pushing a tag like "v0.1.0".  Creates a draft GitHub Release
# with release notes generated from git log, and opens a PR to update
# CHANGELOG.md (to avoid pushing directly to a protected master branch).
#
# PyPI publishing is handled by a separate workflow (publish.yml) which
# triggers when the draft release is promoted to "Published".
#
# Release notes and CHANGELOG.md are generated from the same git log output,
# ensuring they always agree (unless you manually edit the draft notes).

name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}  # no workflow-level permissions; each job declares its own

jobs:
  # ── Create draft GitHub Release and open CHANGELOG PR ───────────────
  github-release:
    name: Create draft GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          ref: master
          fetch-depth: 0  # full history needed for git log

      - name: Generate release notes from git log
        id: notes
        run: |
          # Find the previous tag
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          VERSION="${GITHUB_REF_NAME#v}"

          echo "Generating notes for $GITHUB_REF_NAME (previous: $PREV_TAG)"

          # Build release notes from git log
          {
            echo "notes<<EOF"
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log --pretty=format:"- %s" "$PREV_TAG".."$GITHUB_REF_NAME" | grep -v "^- release:" | grep -iv "^- Merge "
            else
              git log --pretty=format:"- %s" "$GITHUB_REF_NAME" | grep -v "^- release:" | grep -iv "^- Merge "
            fi
            echo ""
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo "pip install uk-bank-statement-anonymiser==$VERSION"
            echo '```'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          draft: true
          body: ${{ steps.notes.outputs.notes }}

      - name: Update CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DATE=$(date -u +%Y-%m-%d)
          {
            echo "## [$VERSION] - $DATE"
            echo ""
            echo "### Added"
            echo ""
            echo "${{ steps.notes.outputs.notes }}" | grep '^- '
            echo ""
          } > /tmp/changelog_entry.md
          python3 -c "
          with open('/tmp/changelog_entry.md') as f:
              entry = f.read()
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          content = content.replace('## [Unreleased]', '## [Unreleased]\n\n' + entry, 1)
          with open('CHANGELOG.md', 'w') as f:
              f.write(content)
          "

      - name: Create PR for CHANGELOG.md
        uses: peter-evans/create-pull-request@4320041ed380b20e97d388d56a7fb4f9b8c20e79  # v7
        with:
          commit-message: "docs: update CHANGELOG.md for ${{ github.ref_name }}"
          branch: "changelog/${{ github.ref_name }}"
          title: "docs: update CHANGELOG.md for ${{ github.ref_name }}"
          body: |
            Automated PR to update CHANGELOG.md with release notes for ${{ github.ref_name }}.

            **Merge this PR before publishing the draft release.**
          labels: documentation
